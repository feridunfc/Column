name: Column offline architecture and unit contracts

on:
  push:
    branches:
      - main
      - 'worker/**'
  pull_request:

jobs:
  contracts-and-unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify canonical architecture
        run: python tools/check_architecture_contract.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Execute offline section example
        run: python -m examples.section_pilot
      - name: Verify indexed constitutional and AB evidence
        run: python tools/validate_b8_ledger.py
      - name: Verify B9 release remains HOLD
        run: python -m tools.b9_review_release_gate
      - name: Publish observed 72 144 288 numeric diagnostics
        run: python -m examples.b9_numerical_review
