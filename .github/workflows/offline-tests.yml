name: Column offline architecture and unit contracts

on:
  push:
    branches:
      - main
      - 'worker/**'
  pull_request:

jobs:
  contracts-and-unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify canonical architecture
        run: python tools/check_architecture_contract.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Execute offline section example
        run: python -m examples.section_pilot
